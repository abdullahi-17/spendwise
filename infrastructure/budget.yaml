AWSTemplateFormatVersion: "2010-09-09"
Description: Optional account-wide monthly cost alert; does not stop spending.
Parameters:
  BudgetEmail:
    Type: String
    Description: Email address receiving budget alerts.
    AllowedPattern: '^[^\s@]+@[^\s@]+\.[^\s@]+$'
  MonthlyLimitUSD:
    Type: Number
    Default: 10
    MinValue: 1
    Description: Account-wide monthly USD alert threshold, not a SpendWise-only estimate.
Resources:
  AccountBudget:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetName: !Sub "${AWS::StackName}-account-monthly"
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit:
          Amount: !Ref MonthlyLimitUSD
          Unit: USD
      NotificationsWithSubscribers:
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 80
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref BudgetEmail
        - Notification:
            NotificationType: FORECASTED
            ComparisonOperator: GREATER_THAN
            Threshold: 100
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref BudgetEmail
